name: Build and release tags

on:
  push:
    tags:
      - 'v*'

# 普通分支 push、PR 与手动操作不触发；版本校验通过后才进入构建。

# 构建只读仓库；仅最终发布作业取得写 Release 所需权限。
permissions:
  contents: read

# 同一 tag 串行处理，避免取消正在上传资产的发布作业。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release safety and tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m unittest discover -s scripts -p 'release_test.py'
          python scripts/release.py validate --tag "$RELEASE_TAG"

  build:
    needs: validate
    # Linux 需要构建 ImageMagick 7，再运行完整后端测试与 Rust release 构建。
    timeout-minutes: 60
    env:
      KITO_REQUIRE_BACKEND: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: ImageMagick 7 on macOS
        if: runner.os == 'macOS'
        run: brew install imagemagick
      - name: FFmpeg and ffprobe on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "KITO_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: ImageMagick 7 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config openssl libpng-dev libjpeg-dev libwebp-dev libtiff-dev liblcms2-dev
          curl -fL --retry 3 https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.2-18.tar.gz -o /tmp/im.tar.gz
          tar -xf /tmp/im.tar.gz -C /tmp
          cd /tmp/ImageMagick-7.1.2-18
          ./configure --with-quantum-depth=16 --enable-hdri --without-perl
          make -j2
          sudo make install
          sudo ldconfig
      - name: FFmpeg and ffprobe on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg
      - name: ImageMagick 7 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install imagemagick -y --no-progress
          $directory = Get-ChildItem 'C:\Program Files' -Directory -Filter 'ImageMagick*' | Select-Object -First 1
          if (-not $directory) { throw 'ImageMagick directory not found' }
          $directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: FFmpeg and ffprobe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: OpenSSL 3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # runner 的 Git for Windows 带有 OpenSSL；实际检查版本后再用于密钥测试。
          $candidates = @('C:\Program Files\Git\usr\bin\openssl.exe', 'C:\Program Files\OpenSSL-Win64\bin\openssl.exe')
          $selected = $null
          foreach ($candidate in $candidates) {
            if ((Test-Path $candidate) -and ((& $candidate version) -match '^OpenSSL 3\.')) {
              $selected = $candidate
              break
            }
          }
          if (-not $selected) { throw 'OpenSSL 3.x was not found on this runner' }
          "KITO_OPENSSL=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify and build native binary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release --target "$RELEASE_TARGET"
      - name: Check binary version and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py package --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          # 仅替换本次 workflow 的临时 artifact，支持重跑失败的构建；不覆盖 Release。
          overwrite: true

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: Verify all assets, then publish a complete release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish --tag "$RELEASE_TAG" --artifacts artifacts --output dist
